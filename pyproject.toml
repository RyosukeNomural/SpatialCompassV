[project]
name = "scomv"
version = "0.1.1"
description = "Spatial omics analysis tools for cell/gene clustering from a standard region"
readme = "README.md"
authors = [
  {name = "Ryosuke Nomura", email = "nomubare123@g.ecc.u-tokyo.ac.jp"}
]
maintainers = [
  {name = "Ryosuke Nomura", email = "nomubare123@g.ecc.u-tokyo.ac.jp"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
requires-python = ">= 3.10"

dependencies = [
  "adjustText",
  "anndata==0.10.5.post1",
  "dask==2024.8.0",
  "dask-expr==1.1.10",
  "fsspec==2023.6.0",
  "geopandas==1.0.1",
  "llvmlite==0.41.1",
  "matplotlib",
  "numba==0.58.1",
  "numcodecs==0.12.1",
  "numpy==1.26.4",
  "ome-zarr==0.10.2",
  "opencv-python==4.11.0.86",
  "pandas==2.3.0",
  "plotly",
  "pyogrio==0.11.0",
  "scanpy==1.11.3",
  "scikit-bio==0.7.0",
  "scikit-learn==1.7.2",
  "scipy==1.11.4",
  "seaborn",
  "shapely==2.0.7",
  "spatialdata==0.2.5.post0",
  "squidpy==1.6.1",
  "stlearn==1.2.2",
  "tblib==3.1.0",
  # ---- TensorFlow stack (prefer 2.17.1; fallback on macOS Intel) ----
  "tensorflow==2.16.2; python_version>=\"3.11\" and platform_system==\"Darwin\" and platform_machine==\"x86_64\"",
  "tensorboard==2.16.2; python_version>=\"3.11\" and platform_system==\"Darwin\" and platform_machine==\"x86_64\"",
  "tensorflow==2.17.1; python_version>=\"3.11\" and (platform_system!=\"Darwin\" or platform_machine!=\"x86_64\")",
  "tensorboard==2.17.1; python_version>=\"3.11\" and (platform_system!=\"Darwin\" or platform_machine!=\"x86_64\")",


  "tensorboard-data-server==0.7.2",
  "tensorflow-io-gcs-filesystem==0.37.1",
  "streamlit>=1.35",
  "streamlit-authenticator>=0.4",
  "pyyaml",
  "tqdm",
  "typer",
  "xarray==2024.7.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/RyosukeNomural/scomv/issues"
changelog = "https://github.com/RyosukeNomural/scomv/blob/master/changelog.md"
homepage = "https://github.com/RyosukeNomural/scomv"

[project.scripts]
scomv = "scomv.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
