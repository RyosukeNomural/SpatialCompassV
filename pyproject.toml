[project]
name = "scomv"
version = "0.1.0"
description = "Spatial omics analysis tools for cell/gene clustering from a standard region"
readme = "README.md"
authors = [
  {name = "Ryosuke Nomura", email = "nomubare123@g.ecc.u-tokyo.ac.jp"}
]
maintainers = [
  {name = "Ryosuke Nomura", email = "nomubare123@g.ecc.u-tokyo.ac.jp"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
requires-python = ">= 3.10"

dependencies = [
  "typer",
  "numpy==1.26.4",
  "pandas==2.3.0",
  "scanpy==1.11.3",
  "scipy==1.11.4",
  "squidpy==1.6.1",
  "stlearn==1.2.2",
  "anndata",
  "scikit-bio==0.7.0",
  "scikit-learn>=1.7,<2",
  "matplotlib",
  "seaborn",
  "adjustText",
  "plotly",
  "opencv-python<4.12",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/RyosukeNomural/scomv/issues"
changelog = "https://github.com/RyosukeNomural/scomv/blob/master/changelog.md"
homepage = "https://github.com/RyosukeNomural/scomv"

[project.scripts]
scomv = "scomv.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
